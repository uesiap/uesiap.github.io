<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICEU AU ZONE - Prayer & Praising Points</title>
    <meta property="og:site_name" content="Melam Rahul">
    <meta property="og:title" content="AU Zone EU & EGF Prayer Requests">
    <meta property="og:description" content="See the AU ZONE EU & EGF Prayer Points">
    <meta property="og:url" content="https://uesiap.github.io/au-zone/prayer/">
    <meta property="og:type" content="website">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/au-zone/assets/styles/prayer/index.css?v={{ site.github.build_revision }}">
</head>

<body>
    <div class="topbar">
        <img src="https://i.ibb.co/7bm6tMK/au-logo.png" alt="AU ZONE">
        <h2>ICEU AU ZONE - Prayer & Praising Points</h2>
    </div>

    <div class="page-wrap">
        <div class="card">
            <div class="card-title-custom">
                AU ZONE EU & EGF<br>Prayer & Praising Points
            </div>
            <div class="card-body">

                <a href="/au-zone/prayer/submit_requests" class="btn btn-outline-success btn-submit-req">
                    <i class="fas fa-pen"></i> Submit Prayer Requests
                </a>

                <div class="section-title">View Submitted Requests</div>

                <form id="selectionForm">
                    <div class="mb-3">
                        <label for="year" class="form-label">Year</label>
                        <select id="year" class="form-select"></select>
                    </div>
                    <div class="mb-3">
                        <label for="month" class="form-label">Month</label>
                        <select id="month" class="form-select"></select>
                    </div>
                    <button type="submit" class="btn-view">View Requests</button>
                </form>

                <div id="error-message" class="error"></div>
            </div>
        </div>
    </div>

    <footer>This is an auto generated page. designed by Rahul.</footer>

    <script>
        // Page settings used by the AU Zone script
        window.PRAYER_CONFIG = {
            basePath: "",
            homePath: "/au-zone/prayer/",
            submitPath: "/au-zone/prayer/submit_requests",
            requestsPath: "/au-zone/prayer/requests_data_page"
        };
    </script>
    <script src="/au-zone/assets/scripts/prayer/index.js?v={{ site.github.build_revision }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
