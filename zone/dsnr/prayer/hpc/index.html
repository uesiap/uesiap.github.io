<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyderabad Pioneering Cell Prayer Letter - Prayer & Praising Points</title>
    <meta property="og:site_name" content="Dsnr Zone">
    <meta property="og:title" content="Hyderabad HPC Prayer & Praising Points">
    <meta property="og:description" content="HPC Ministry Prayer and Praising Points Secretary">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
        }

        .topbar {
            background-color: #fff;
            padding: 10px 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar img {
            width: 50px;
            height: 50px;
            padding: 4px;
        }

        .topbar h2 {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
        }

        .page-wrap {
            max-width: 620px;
            margin: 2rem auto;
            padding: 0 12px;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: 0;
        }

        .card-title-custom {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 1.2rem 1rem 0.5rem;
            line-height: 1.5;
        }

        .card-body {
            padding: 1.5rem 2rem 2rem;
        }

        .form-label {
            font-weight: bold;
            color: #197afe;
        }

        .section-title {
            font-weight: bold;
            color: #029012;
            border-top: 2px solid #029012;
            padding-top: 12px;
            margin-top: 20px;
            margin-bottom: 16px;
        }

        .btn-submit-req {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
        }

        .btn-view {
            background-color: #029012;
            color: #fff;
            border: none;
            width: 100%;
            padding: 0.7rem;
            border-radius: 6px;
            font-size: 1rem;
            margin-top: 8px;
        }

        .btn-view:hover {
            background-color: #45a049;
            color: #fff;
        }

        .error {
            color: red;
            font-weight: bold;
            margin-top: 1rem;
            display: none;
        }

        footer {
            text-align: center;
            font-size: 13px;
            margin: 30px 0 20px;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <img src="https://uesiap.github.io/au-zone/prayer/uesi-logo.jpg" alt="DSNR Zone logo">
        <h2>Hyderabad Pioneering Cell</h2>
    </div>

    <div class="page-wrap">
        <div class="card">
            <div class="card-title-custom">
                Hyderabad District<br>HPC Ministry – Prayer & Praising Points
            </div>
            <div class="card-body">

                <a href="/zone/dsnr/prayer/hpc/submit_requests" class="btn btn-outline-success btn-submit-req">
                    <i class="fas fa-pen"></i> Submit Prayer Requests
                </a>

                <div class="section-title">View Submitted Requests</div>

                <form id="selectionForm">
                    <div class="mb-3">
                        <label for="year" class="form-label">Year</label>
                        <select id="year" class="form-select"></select>
                    </div>
                    <div class="mb-3">
                        <label for="month" class="form-label">Month</label>
                        <select id="month" class="form-select"></select>
                    </div>
                    <button type="submit" class="btn-view">View Requests</button>
                </form>

                <div id="error-message" class="error"></div>
            </div>
        </div>
    </div>

    <script>
        const monthNames = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const yearSelect = document.getElementById('year');
            const monthSelect = document.getElementById('month');
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;

            // Previous, current and next year
            for (let year = currentYear - 1; year <= currentYear + 1; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === currentYear) option.selected = true;
                yearSelect.appendChild(option);
            }

            // Months
            monthNames.forEach((name, index) => {
                const option = document.createElement('option');
                option.value = index + 1;
                option.textContent = name;
                if (index + 1 === currentMonth) option.selected = true;
                monthSelect.appendChild(option);
            });
        });

        document.getElementById('selectionForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const year = document.getElementById('year').value;
            const month = document.getElementById('month').value;
            const errorMessage = document.getElementById('error-message');

            if (!year || !month) {
                errorMessage.textContent = 'Please select year and month.';
                errorMessage.style.display = 'block';
                return;
            }

            const encodedYear = btoa(year);
            const encodedMonth = btoa(month);

            window.location.href =
                `/zone/dsnr/prayer/hpc/requests_data_page?utm=${encodeURIComponent(encodedYear)}&auth=${encodeURIComponent(encodedMonth)}`;
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
